<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ServicePay</title><meta name="description" content="Loading ServicePay…"><link rel="icon" href="/favicon.png"><script>
// GitHub Pages sends unknown paths here. Load the Flutter shell without
// changing location, so /edupay and its query survive the app bootstrap.
(async function () {
  try {
    const response = await fetch('/');
    if (!response.ok) return;
    document.open();
    document.write(await response.text());
    document.close();
  } catch (_) {
    // Keep the accessible fallback below when the app shell is unavailable.
  }
}());
</script></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="/"><span>Service<b>Pay</b></span></a><a class="nav-cta" href="/">Go home</a></div></header><main><section class="hero"><div class="wrap"><span class="eyebrow">ServicePay</span><h1>Opening ServicePay…</h1><p class="lead">If the app does not load, return to the official homepage.</p><div class="actions"><a class="button" href="/">Return home</a></div></div></section></main></body></html>
