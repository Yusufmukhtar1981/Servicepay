name: Build ServicePay APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ServicePay
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter information
        run: flutter doctor -v

      - name: Clean project
        run: flutter clean

      - name: Download packages
        run: flutter pub get

      - name: Generate ServicePay App Icon
        run: dart run flutter_launcher_icons

      - name: Build ServicePay Debug APK
        run: flutter build apk --debug

      - name: Confirm APK exists
        run: |
          ls -la build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload ServicePay APK
        uses: actions/upload-artifact@v4
        with:
          name: ServicePay-Test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
