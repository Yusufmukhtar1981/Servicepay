name: servicepay_app
description: "Servicepay bill payment application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  http_parser: ^4.1.2
  shared_preferences: ^2.5.3

  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.2

  url_launcher: ^6.3.2

  screenshot: ^3.0.0
  share_plus: ^13.3.0
  gal: ^2.3.3
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0

  # =====================================================
  # SERVICEPAY KEKE
  # =====================================================

  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.2

  # Incoming ride ringing while Rider screen is open.
  audioplayers: ^6.4.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0
  file_picker: ^8.1.7
  nigeria_lg_state_city: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/image/

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/image/servicepay_logo.png"

  adaptive_icon_background: "#0F766E"

  adaptive_icon_foreground: "assets/image/servicepay_logo.png"

  min_sdk_android: 21
