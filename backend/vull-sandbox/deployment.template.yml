# Template only; this repository's production deployment target is untouched.
services:
  vull-sandbox-api:
    command: npm --prefix backend run start:vull-sandbox
    environment:
      VULL_ENV: sandbox
      VULL_SANDBOX_MONGODB_URI: ${VULL_SANDBOX_MONGODB_URI}
      VULL_SANDBOX_MONGO_ALLOWED_HOSTS: ${VULL_SANDBOX_MONGO_ALLOWED_HOSTS}
      VULL_SANDBOX_MONGO_DATABASE: ${VULL_SANDBOX_MONGO_DATABASE}
      VULL_PRODUCTION_MONGO_FINGERPRINTS: ${VULL_PRODUCTION_MONGO_FINGERPRINTS}
      VULL_SANDBOX_AUTH_PEPPER: ${VULL_SANDBOX_AUTH_PEPPER}
      VULL_SANDBOX_WEBHOOK_SIGNING_SECRET: ${VULL_SANDBOX_WEBHOOK_SIGNING_SECRET}
    # Provision a distinct sandbox Mongo database; production DB variables must be absent.
  vull-sandbox-worker:
    command: npm --prefix backend run worker:vull-sandbox
    environment:
      VULL_ENV: sandbox
      VULL_SANDBOX_MONGODB_URI: ${VULL_SANDBOX_MONGODB_URI}
      VULL_SANDBOX_MONGO_ALLOWED_HOSTS: ${VULL_SANDBOX_MONGO_ALLOWED_HOSTS}
      VULL_SANDBOX_MONGO_DATABASE: ${VULL_SANDBOX_MONGO_DATABASE}
      VULL_PRODUCTION_MONGO_FINGERPRINTS: ${VULL_PRODUCTION_MONGO_FINGERPRINTS}
      VULL_SANDBOX_AUTH_PEPPER: ${VULL_SANDBOX_AUTH_PEPPER}
      VULL_SANDBOX_WEBHOOK_SIGNING_SECRET: ${VULL_SANDBOX_WEBHOOK_SIGNING_SECRET}
      VULL_SANDBOX_WORKER_POLL_INTERVAL_MS: 1000